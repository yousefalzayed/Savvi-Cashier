let booting = false;
async function boot() {
  if (booting) return; booting = true;
  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) { booting = false; return go('signin'); }

    if (error || !ok) { booting = false; return go('notadmin'); }
    await loadAll(); booting = false; go('main');
  } catch (e) { booting = false; S.err = e.message; go('notadmin'); }
}

  catch (e) { S.busy = false; render(); toast(e.message || String(e), true); }
}

async function loadStudents() { const { data, error } = await sb.rpc('admin_list_students', { p_search: S.q || null }); if (error) toast(error.message, true); S.studs = data || []; }

async function sendLink(ev) {
  ev.preventDefault(); const email = (document.getElementById('email').value || '').trim().toLowerCase();

  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
  S.busy = false; if (error) { S.err = error.message; return render(); } S.err = ''; go('sent');
}

  if (!r || typeof r !== 'object') return '';
  const val = (v) => v == null ? '—' : typeof v === 'number' ? (Number.isInteger(v) ? v : kwd(v)) : esc(v);
  const lab = (k) => esc(String(k).replace(/_/g, ' '));
  const block = (k, v) => {
    if (Array.isArray(v)) { if (!v.length) return `<div class="line"><span>${lab(k)}</span><span>—</span></div>`;
      if (typeof v[0] !== 'object') return `<div class="line"><span>${lab(k)}</span><span>${v.map(val).join(', ')}</span></div>`;
      const cols = Object.keys(v[0]); return `<h3>${lab(k)}</h3><div class="tbl"><table><thead><tr>${cols.map(c => `<th>${lab(c)}</th>`).join('')}</tr></thead><tbody>${v.map(row => `<tr>${cols.map(c => `<td>${val(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
    if (v && typeof v === 'object') return `<h3>${lab(k)}</h3>${Object.entries(v).map(([a, b]) => typeof b === 'object' && b ? block(a, b) : `<div class="line"><span>${lab(a)}</span><b>${val(b)}</b></div>`).join('')}`;
    return `<div class="line"><span>${lab(k)}</span><b>${val(v)}</b></div>`;
  };
  return Object.entries(r).map(([k, v]) => block(k, v)).join('');
}
function settings() {
  const D = S.D, tiers = D.tiers.filter(x => x.status === 'active');
  const rng = (r) => `${r.min_paid == null ? '0' : (r.min_inclusive ? '≥ ' : '> ') + kwd(r.min_paid)}${r.max_paid == null ? ' +' : ' … ' + (r.max_inclusive ? '≤ ' : '< ') + kwd(r.max_paid)}`;
  return `<div class="card"><h2>${t('appSettings')}</h2><div class="tbl"><table><thead><tr><th>${t('key')}</th><th>${t('value')}</th><th></th></tr></thead><tbody>
    ${D.settings.filter(s => s.status === 'active').map(s => `<tr><td><b class="mono">${esc(s.key)}</b><div class="muted">${esc(s.description || '')}</div></td>
      <td><input class="in ltr mono" id="set_${esc(s.key)}" value="${esc(JSON.stringify(s.value))}" style="min-width:140px"></td>
      <td><button class="btn btn-light btn-sm" onclick="saveSetting('${esc(s.key)}')">${t('save')}</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="wrap">${tiers.map(tr => `<div class="card"><h2>${t('feeRules')} · ${esc(tr.name)}</h2>${D.rules.filter(r => r.fee_tier_id === tr.id).map(r => `<div class="form" style="grid-template-columns:1fr 110px auto"><span class="ltr" style="font-size:14px">${rng(r)}</span>
      <input class="in ltr" id="rule_${r.id}" value="${kwd(r.fee_amount)}" inputmode="decimal"><button class="btn btn-light btn-sm" onclick="rpc('admin_update_fee_rule',{p_rule_id:'${r.id}',p_fee:parseFloat(document.getElementById('rule_${r.id}').value)})">${t('save')}</button></div>`).join('')}</div>`).join('')}</div>
  <div class="card"><h2>${t('plans')}</h2>${D.plans.filter(p => p.status === 'active').map(p => `<form class="form" style="grid-template-columns:120px 140px 1fr auto" onsubmit="event.preventDefault();savePlan('${p.code}',this)"><b>${esc(p.name)}</b>
      <div><label class="l">${t('price')}</label><input class="in ltr" name="price" value="${kwd(p.monthly_price)}"></div><div><label class="l">${t('sections')}</label><input class="in ltr mono" name="sections" value="${esc(JSON.stringify(p.sections))}"></div><button class="btn btn-light btn-sm">${t('save')}</button></form>`).join('')}</div>
  <div class="card"><h2>${t('unis')}</h2><div class="tbl"><table><tbody>${D.insts.map(i => `<tr><td><b>${esc(nm(i, 'name_en', 'name_ar'))}</b><div class="muted">${esc(i.institution_type || '')}</div></td>
      <td>${D.domains.filter(d => d.institution_id === i.id).map(d => `<span class="acts" style="margin:2px 0"><span class="ltr mono">${esc(d.domain)}</span>${stPill(d.status)}<button class="btn btn-light btn-sm" onclick="rpc('admin_set_domain_status',{p_id:'${d.id}',p_status:'${d.status === 'active' ? 'inactive' : 'active'}'})">${d.status === 'active' ? t('pause') : t('resume')}</button></span>`).join('<br>')}</td>
      <td><form class="acts" onsubmit="const f=F(event);rpc('admin_add_domain',{p_institution_id:'${i.id}',p_domain:f.d})"><input class="in ltr" name="d" placeholder="uni.edu.kw" style="width:150px;height:32px"><button class="btn btn-light btn-sm">+</button></form></td></tr>`).join('')}</tbody></table></div>
    <form class="form" onsubmit="const f=F(event);rpc('admin_create_institution',{p_name_en:f.en,p_name_ar:nz(f.ar),p_type:f.type})"><div><label class="l">${t('nameEn')}</label><input class="in" name="en" required></div><div><label class="l">${t('nameAr')}</label><input class="in" name="ar" dir="rtl"></div>
      <div><label class="l">${t('type')}</label><select class="in" name="type"><option value="university">university</option><option value="college">college</option></select></div><div><button class="btn btn-light">+ ${t('newUni')}</button></div></form></div>
  <div class="card"><h2>${t('cats')}</h2><div class="acts">${D.cats.map(c => `<span class="pill">${esc(nm(c, 'name_en', 'name_ar'))}</span>`).join('')}</div>
    <form class="form" onsubmit="const f=F(event);rpc('admin_create_category',{p_slug:f.slug,p_name_en:f.en,p_name_ar:f.ar})"><div><label class="l">${t('slug')}</label><input class="in ltr" name="slug" placeholder="gym" required></div><div><label class="l">${t('nameEn')}</label><input class="in" name="en" required></div><div><label class="l">${t('nameAr')}</label><input class="in" name="ar" dir="rtl" required></div><div><button class="btn btn-light">+ ${t('addCat')}</button></div></form></div>`;
}
function parseJson(s) { try { return { ok: true, v: JSON.parse(s) }; } catch (e) { return { ok: false }; } }
function saveSetting(key) { const r = parseJson(document.getElementById('set_' + key).value); if (!r.ok) return toast(t('jsonBad'), true); rpc('admin_set_setting', { p_key: key, p_value: r.v }); }
function savePlan(code, form) { const r = parseJson(form.sections.value); if (!r.ok) return toast(t('jsonBad'), true); rpc('admin_update_report_plan', { p_code: code, p_price: parseFloat(form.price.value), p_sections: r.v }); }
function render() { document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr'; document.getElementById('app').innerHTML = V[S.view](); }
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && ['signin', 'sent', 'loading'].includes(S.view)) setTimeout(boot, 0); });
render(); boot();
</script>
</body>
